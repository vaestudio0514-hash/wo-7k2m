<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="补货">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f2f2f7">
<title>补货</title>
<style>
:root{
  --bg:#f2f2f7; --card:#fff; --ink:#1c1c1e; --sub:#8e8e93;
  --line:#e3e3e8; --accent:#0a84ff; --ok:#34c759; --red:#ff3b30;
  --radius:16px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#000; --card:#1c1c1e; --ink:#fff; --sub:#8e8e93; --line:#2c2c2e; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);
  font:15px/1.4 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
  padding-bottom:calc(24px + env(safe-area-inset-bottom));
  -webkit-text-size-adjust:100%;
}
header{
  position:sticky;top:0;z-index:20;background:var(--bg);
  border-bottom:.5px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;
}
.hrow{display:flex;align-items:center;gap:8px}
.htitle{font-size:19px;font-weight:700;letter-spacing:-.3px}
.hdate{font-size:13px;color:var(--sub);margin-left:auto}
.hbig{display:flex;align-items:baseline;gap:5px;margin-top:3px}
.hbig b{font-size:32px;font-weight:700;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.hbig span{font-size:13px;color:var(--sub)}
.hcopy{margin-left:auto;align-self:center;border:none;background:var(--card);
  color:var(--accent);font-size:13px;font-weight:600;padding:8px 13px;border-radius:10px}
.hcopy:active{opacity:.6}
.saveflag{font-size:11px;color:var(--ok);opacity:0;transition:opacity .3s}
.saveflag.on{opacity:1}

main{padding:12px 14px 0}

.card{background:var(--card);border-radius:var(--radius);margin-bottom:11px;overflow:hidden}
.mhead{display:flex;align-items:center;gap:9px;padding:14px 15px;user-select:none}
.chev{color:var(--sub);font-size:11px;transition:transform .2s;width:9px}
.card.open .chev{transform:rotate(90deg)}
.mname{font-size:17px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msub{margin-left:auto;font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums}
.msub b{color:var(--ink);font-size:16px;font-weight:700}
.rows{display:none;padding:0 8px 6px}
.card.open .rows{display:block}

.prow{display:flex;align-items:center;gap:9px;padding:5px 4px}
.prow+.prow{border-top:.5px solid var(--line)}
.thumb{
  width:46px;height:46px;flex:0 0 auto;border-radius:10px;border:none;padding:0;
  background:var(--bg);overflow:hidden;display:flex;align-items:center;justify-content:center;
  color:var(--sub);font-size:19px;
}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb:active{opacity:.7}
.pname{flex:1;min-width:0;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pname.zero{color:var(--sub)}
.btnm,.btnp{
  width:42px;height:42px;border-radius:50%;border:none;flex:0 0 auto;
  font-size:22px;line-height:1;display:flex;align-items:center;justify-content:center;
  background:var(--bg);color:var(--ink);
}
.btnp{background:var(--accent);color:#fff}
.btnm:active,.btnp:active{transform:scale(.9)}
.btnm:disabled{opacity:.3}
.cnt{
  min-width:34px;text-align:center;font-size:19px;font-weight:700;
  font-variant-numeric:tabular-nums;
}
.cnt.zero{color:var(--sub);font-weight:400}

.addp{
  width:calc(100% - 16px);margin:6px 8px 10px;padding:11px;border:none;border-radius:11px;
  background:transparent;color:var(--accent);font-size:14px;font-weight:500;
  border:1.5px dashed var(--line);
}
.addp:active{opacity:.6}

.ops{display:flex;gap:9px;margin-top:4px}
.ops .btn{flex:1;padding:12px;border-radius:11px;border:none;font-size:14px;font-weight:600;
  background:var(--card);color:var(--ink)}
.ops .btn.primary{background:var(--accent);color:#fff}
.ops .btn:active{opacity:.7}
.tip{font-size:12px;color:var(--sub);text-align:center;margin:14px 6px 0;line-height:1.6}

/* sheet */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.mask.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card);
  border-radius:20px 20px 0 0;
  padding:8px 16px calc(16px + env(safe-area-inset-bottom));
  transform:translateY(102%);transition:transform .28s cubic-bezier(.32,.72,0,1);
  max-height:86vh;overflow:auto;
}
.sheet.on{transform:translateY(0)}
.grab{width:36px;height:5px;border-radius:3px;background:var(--line);margin:6px auto 14px}
.stitle{font-size:17px;font-weight:700;margin:0 0 14px}
.field{margin-bottom:13px}
.field label{display:block;font-size:13px;color:var(--sub);margin-bottom:6px}
.field input{
  width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);
  background:var(--bg);color:var(--ink);font-size:16px;outline:none;-webkit-appearance:none;
}
.field input:focus{border-color:var(--accent)}
.hint{font-size:12px;color:var(--sub);line-height:1.55;margin:10px 0}
.actions{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;padding:14px;border-radius:12px;border:none;font-size:16px;font-weight:600;
  background:var(--line);color:var(--ink)}
.btn.primary{background:var(--accent);color:#fff}
.btn.danger{background:transparent;color:var(--red);border:1px solid var(--line)}
.warn{background:#fff3e0;color:#8a5300;border-radius:12px;padding:12px 14px;
  font-size:13px;line-height:1.5;margin-bottom:10px}
@media (prefers-color-scheme: dark){ .warn{background:#332509;color:#ffcf80} }
</style>
</head>
<body>

<header>
  <div class="hrow">
    <div class="htitle">补货</div>
    <div class="hdate" id="hdate"></div>
    <div class="saveflag" id="saveflag">已存</div>
  </div>
  <div class="hbig">
    <b id="grand">0</b><span>件 · 今日合计</span>
    <button class="hcopy" id="copybtn">复制清单</button>
  </div>
</header>

<main id="app"></main>

<input type="file" id="picker" accept="image/*" style="display:none">
<div class="mask" id="mask"></div>
<div class="sheet" id="sheet"></div>

<script>
(function(){
'use strict';

var KEY = 'buhuo.v4';
var DEFAULTS = ['矿泉水','脉动','冰糖雪梨','东方树叶','东鹏补水啦','雀巢咖啡','牛肉干','口香糖'];
var S = null, storageOK = true, flagTimer = null;
var openIds = {}, pendingPi = -1;

function uid(){ return Math.random().toString(36).slice(2,9); }
function today(){
  var d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function cnDate(iso){
  var p = (iso||today()).split('-');
  var d = new Date(+p[0], +p[1]-1, +p[2]);
  return (+p[1])+'月'+(+p[2])+'日 周'+['日','一','二','三','四','五','六'][d.getDay()];
}
function esc(s){
  return String(s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function $(id){ return document.getElementById(id); }
function num(v){
  v = parseInt(v,10);
  if (isNaN(v) || v < 0) v = 0;
  if (v > 9999) v = 9999;
  return v;
}

/* ---------- 数据 ---------- */
function seed(){
  var ps = DEFAULTS.map(function(n){ return { id: uid(), name: n, photo: '' }; });
  var ms = [];
  for (var i=1;i<=7;i++){
    var q = {};
    ps.forEach(function(p){ q[p.id] = 0; });
    ms.push({ id: uid(), name: i+'号机', qty: q });
  }
  return { v:4, date: today(), products: ps, machines: ms, history: [] };
}

/* 旧版迁移：v3 的 products 是纯字符串，qty 用名字当键 */
function migrate(old){
  var s = { v:4, date: old.date||today(), products:[], machines:[], history: old.history||[] };
  var map = {};   // 名字 -> 新 id

  (old.products||[]).forEach(function(p){
    var name = (typeof p === 'string') ? p : p.name;
    if (!name || map[name]) return;
    var id = uid();
    map[name] = id;
    s.products.push({ id: id, name: name, photo: (p && p.photo) || '' });
  });

  (old.machines||[]).forEach(function(m){
    var nq = {};
    s.products.forEach(function(p){ nq[p.id] = 0; });
    var src = m.qty || {};
    Object.keys(src).forEach(function(k){
      var id = map[k];                       // v3: 键是名字
      if (id) nq[id] = num(src[k]);
    });
    // v2: 每台自己有 items
    (m.items||[]).forEach(function(it){
      var id = map[it.name];
      if (!id){ id = uid(); map[it.name] = id; s.products.push({id:id,name:it.name,photo:''}); }
      nq[id] = num(it.qty);
      s.machines.forEach(function(x){ x.qty[id] = 0; });
    });
    s.machines.push({ id: m.id||uid(), name: m.name||'机子', qty: nq });
  });

  if (!s.products.length){
    DEFAULTS.forEach(function(n){
      var id = uid(); map[n] = id;
      s.products.push({ id:id, name:n, photo:'' });
    });
  }
  if (!s.machines.length){
    s.machines = seed().machines;
  }
  s.machines.forEach(function(m){
    s.products.forEach(function(p){ if (!(p.id in m.qty)) m.qty[p.id] = 0; });
  });
  return s;
}

function normalize(s){
  if (!s || !Array.isArray(s.machines) || !Array.isArray(s.products)) s = seed();
  if (!Array.isArray(s.history)) s.history = [];
  if (!s.date) s.date = today();

  // 老结构兜底
  if (s.products.length && typeof s.products[0] === 'string') s = migrate(s);

  s.products = s.products.filter(function(p){ return p && p.id; }).map(function(p){
    return { id: p.id, name: String(p.name||'未命名'), photo: p.photo || '' };
  });
  if (!s.products.length) s.products = seed().products;

  s.machines = s.machines.filter(function(m){ return m && m.id; });
  if (!s.machines.length) s.machines = seed().machines;

  s.machines.forEach(function(m){
    if (!m.qty || typeof m.qty !== 'object') m.qty = {};
    var nq = {};
    s.products.forEach(function(p){ nq[p.id] = num(m.qty[p.id]); });
    m.qty = nq;
  });
  return s;
}

function load(){
  var s;
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) s = JSON.parse(raw);
    else {
      var v3 = localStorage.getItem('buhuo.v3');
      var v2 = localStorage.getItem('buhuo.v2');
      s = v3 ? migrate(JSON.parse(v3)) : (v2 ? migrate(JSON.parse(v2)) : seed());
    }
  } catch(e){ storageOK = false; s = seed(); }
  return normalize(s);
}

function save(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); storageOK = true; }
  catch(e){ storageOK = false; }
  var f = $('saveflag');
  if (f && storageOK){
    f.classList.add('on');
    clearTimeout(flagTimer);
    flagTimer = setTimeout(function(){ f.classList.remove('on'); }, 900);
  }
}

function rollover(){
  var t = today();
  if (S.date === t) return false;
  var g = grand();
  if (g > 0){
    S.history.unshift({ date: S.date, total: g });
    S.history = S.history.slice(0, 60);
  }
  S.machines.forEach(function(m){
    S.products.forEach(function(p){ m.qty[p.id] = 0; });
  });
  S.date = t;
  save();
  return true;
}

/* ---------- 统计 ---------- */
function grand(){
  var g = 0;
  S.machines.forEach(function(m){
    S.products.forEach(function(p){ g += num(m.qty[p.id]); });
  });
  return g;
}
function machTotal(m){
  var t = 0;
  S.products.forEach(function(p){ t += num(m.qty[p.id]); });
  return t;
}
function prodTotal(pid){
  var t = 0;
  S.machines.forEach(function(m){ t += num(m.qty[pid]); });
  return t;
}

/* ---------- 渲染 ---------- */
function render(){
  $('hdate').textContent = cnDate(S.date);
  var o = [];

  if (!storageOK){
    o.push('<div class="warn">这个环境存不下数据，请用 Safari 打开 http://127.0.0.1:8765/</div>');
  }

  S.machines.forEach(function(m, mi){
    var open = !!openIds[m.id];
    o.push('<section class="card'+(open?' open':'')+'">');
    o.push('<div class="mhead" data-act="toggle" data-mi="'+mi+'">');
    o.push('<span class="chev">▶</span>');
    o.push('<span class="mname" data-act="rename" data-mi="'+mi+'">'+esc(m.name)+'</span>');
    o.push('<span class="msub" data-sub="'+mi+'"><b>'+machTotal(m)+'</b> 件</span>');
    o.push('</div>');
    o.push('<div class="rows">');

    S.products.forEach(function(p, pi){
      var v = num(m.qty[p.id]);
      o.push('<div class="prow" data-mi="'+mi+'" data-pi="'+pi+'">');
      o.push('<button class="thumb" data-act="photo" data-mi="'+mi+'" data-pi="'+pi+'">'+
        (p.photo ? '<img src="'+p.photo+'" alt="">' : '📷')+'</button>');
      o.push('<span class="pname'+(v?'':' zero')+'" data-act="editprod" data-pi="'+pi+'">'+esc(p.name)+'</span>');
      o.push('<button class="btnm" data-act="dec" data-mi="'+mi+'" data-pi="'+pi+'"'+(v?'':' disabled')+'>−</button>');
      o.push('<span class="cnt'+(v?'':' zero')+'" data-cnt="'+mi+'_'+pi+'">'+(v||'0')+'</span>');
      o.push('<button class="btnp" data-act="inc" data-mi="'+mi+'" data-pi="'+pi+'">+</button>');
      o.push('</div>');
    });

    o.push('<button class="addp" data-act="addprod">＋ 加一个品种</button>');
    o.push('</div></section>');
  });

  o.push('<div class="ops">'+
    '<button class="btn primary" data-act="copy">复制清单</button>'+
    '<button class="btn" data-act="manage">管理</button>'+
  '</div>');
  o.push('<div class="tip">点方块照片可以拍照或选图 · 点机子名改名 · 每天第一次打开自动清零</div>');

  $('app').innerHTML = o.join('');
  paint();
}

function paint(){
  $('grand').textContent = grand();
  S.machines.forEach(function(m, mi){
    var sub = document.querySelector('[data-sub="'+mi+'"]');
    if (sub) sub.innerHTML = '<b>'+machTotal(m)+'</b> 件';
  });
}

function paintRow(mi, pi){
  var m = S.machines[mi];
  var p = S.products[pi];
  if (!m || !p) return;
  var v = num(m.qty[p.id]);
  var cnt = document.querySelector('[data-cnt="'+mi+'_'+pi+'"]');
  if (cnt){ cnt.textContent = v; cnt.className = 'cnt' + (v?'':' zero'); }
  var row = document.querySelector('.prow[data-mi="'+mi+'"][data-pi="'+pi+'"]');
  if (row){
    var dec = row.querySelector('.btnm');
    if (dec) dec.disabled = !v;
    var nm = row.querySelector('.pname');
    if (nm) nm.classList.toggle('zero', !v);
  }
  paint();
}

/* ---------- 弹层 ---------- */
function openSheet(html){
  $('sheet').innerHTML = '<div class="grab"></div>'+html;
  $('mask').classList.add('on');
  $('sheet').classList.add('on');
}
function closeSheet(){
  $('mask').classList.remove('on');
  $('sheet').classList.remove('on');
  setTimeout(function(){ $('sheet').innerHTML=''; }, 260);
}

function sheetMachine(mi){
  var m = S.machines[mi];
  openSheet(
    '<div class="stitle">改机子名字</div>'+
    '<div class="field"><input id="f_m" value="'+esc(m.name)+'" autocomplete="off"></div>'+
    '<div class="hint">例如「东门1号」「二楼左」。</div>'+
    '<div class="actions"><button class="btn" id="f_c">取消</button>'+
    '<button class="btn primary" id="f_s">保存</button></div>'+
    '<div class="actions"><button class="btn danger" id="f_d">删掉这台</button></div>'
  );
  $('f_c').onclick = closeSheet;
  $('f_d').onclick = function(){
    if (S.machines.length<=1){ alert('至少留一台'); return; }
    if (!confirm('删掉「'+m.name+'」？')) return;
    S.machines.splice(mi,1);
    save(); closeSheet(); render();
  };
  $('f_s').onclick = function(){
    var v = $('f_m').value.trim();
    if (!v) return;
    m.name = v; save(); closeSheet(); render();
  };
  setTimeout(function(){ var e=$('f_m'); if(e) e.select(); }, 300);
}

function sheetProduct(pi){
  var p = S.products[pi];
  openSheet(
    '<div class="stitle">改品种</div>'+
    '<div class="field"><label>名字</label><input id="f_p" value="'+esc(p.name)+'" autocomplete="off"></div>'+
    '<div class="actions"><button class="btn danger" id="f_d">删掉</button>'+
    '<button class="btn" id="f_c">取消</button>'+
    '<button class="btn primary" id="f_s">保存</button></div>'+
    '<div class="hint">照片直接在列表里点方块拍，不用进这里。</div>'
  );
  $('f_c').onclick = closeSheet;
  $('f_d').onclick = function(){
    if (S.products.length<=1){ alert('至少留一个品种'); return; }
    if (!confirm('删掉「'+p.name+'」？所有机子这一栏都会没')) return;
    S.products.splice(pi,1);
    save(); closeSheet(); render();
  };
  $('f_s').onclick = function(){
    var v = $('f_p').value.trim();
    if (!v) return;
    p.name = v; save(); closeSheet(); render();
  };
  setTimeout(function(){ var e=$('f_p'); if(e) e.select(); }, 300);
}

function sheetAddProduct(){
  openSheet(
    '<div class="stitle">加一个品种</div>'+
    '<div class="field"><label>名字</label><input id="f_np" placeholder="例如：可乐" autocomplete="off"></div>'+
    '<div class="hint">7 台机子都会加上这一行，数字从 0 开始。</div>'+
    '<div class="actions"><button class="btn" id="f_c">取消</button>'+
    '<button class="btn primary" id="f_s">加上</button></div>'
  );
  $('f_c').onclick = closeSheet;
  $('f_s').onclick = function(){
    var v = $('f_np').value.trim();
    if (!v) return;
    if (S.products.some(function(x){ return x.name===v; })){ alert('已经有这个品种'); return; }
    var p = { id: uid(), name: v, photo: '' };
    S.products.push(p);
    S.machines.forEach(function(m){ m.qty[p.id] = 0; });
    save(); closeSheet(); render();
  };
  setTimeout(function(){ var e=$('f_np'); if(e) e.focus(); }, 300);
}

function sheetManage(){
  var hist = (S.history||[]).slice(0,8).map(function(h){
    return '<div style="display:flex;justify-content:space-between;padding:10px 2px;font-size:15px;border-bottom:.5px solid var(--line)">'+
      '<span>'+cnDate(h.date)+'</span><span style="color:var(--sub)">'+(h.total||0)+' 件</span></div>';
  }).join('') || '<div class="hint">还没有历史</div>';

  openSheet(
    '<div class="stitle">管理</div>'+
    '<button class="btn" style="width:100%;margin-bottom:9px" id="g_mach">＋ 加一台机子</button>'+
    '<button class="btn" style="width:100%;margin-bottom:9px" id="g_prods">导入品种清单</button>'+
    '<button class="btn" style="width:100%;margin-bottom:9px" id="g_backup">导出备份</button>'+
    '<button class="btn" style="width:100%;margin-bottom:9px" id="g_import">从备份恢复</button>'+
    '<button class="btn danger" style="width:100%;margin-bottom:9px" id="g_reset">今日全部清零</button>'+
    '<div class="stitle" style="font-size:14px;margin:18px 0 2px">最近几天</div>'+hist+
    '<div class="hint">品种和照片在「导出备份」里也能一起带走。</div>'+
    '<div class="actions"><button class="btn" id="g_close">关闭</button></div>'
  );
  $('g_close').onclick = closeSheet;
  $('g_mach').onclick = function(){
    var q = {}, m = { id: uid(), name: (S.machines.length+1)+'号机', qty: q };
    S.products.forEach(function(p){ q[p.id] = 0; });
    S.machines.push(m);
    save(); closeSheet(); render();
  };
  $('g_prods').onclick = function(){
    var txt = prompt('粘贴品种清单，每行一个（也可以逗号隔开）：');
    if (!txt) return;
    var list = txt.split(/[\n\r,，、;；]+/).map(function(x){ return x.trim(); })
      .filter(function(x){ return x; });
    var uniq = [];
    list.forEach(function(x){ if (uniq.indexOf(x)<0) uniq.push(x); });
    if (!uniq.length) return;
    if (!confirm('品种换成这 '+uniq.length+' 个？同名数字会保留。')) return;
    var old = {};
    S.products.forEach(function(p){ old[p.name] = p; });
    S.products = uniq.map(function(n){
      return old[n] ? old[n] : { id: uid(), name: n, photo: '' };
    });
    S.machines.forEach(function(m){
      var nq = {};
      S.products.forEach(function(p){ nq[p.id] = num(m.qty[p.id]); });
      m.qty = nq;
    });
    save(); closeSheet(); render(); alert('品种已更新');
  };
  $('g_backup').onclick = function(){ closeSheet(); copyText(JSON.stringify(S)); };
  $('g_import').onclick = function(){
    var txt = prompt('粘贴备份内容：');
    if (!txt) return;
    try {
      var o = JSON.parse(txt);
      if (!o || !Array.isArray(o.machines)) throw 0;
      S = normalize(o);
      save(); closeSheet(); render(); alert('恢复完成');
    } catch(e){ alert('内容不对，没恢复'); }
  };
  $('g_reset').onclick = function(){
    if (!confirm('今天全部清零？')) return;
    S.machines.forEach(function(m){ S.products.forEach(function(p){ m.qty[p.id] = 0; }); });
    save(); closeSheet(); render();
  };
}

/* ---------- 照片 ---------- */
function pickPhoto(pi){
  pendingPi = pi;
  var el = $('picker');
  el.value = '';
  el.click();
}

function shrink(file, cb){
  var fr = new FileReader();
  fr.onload = function(){
    var img = new Image();
    img.onload = function(){
      var max = 260;
      var w = img.naturalWidth || img.width;
      var h = img.naturalHeight || img.height;
      var s = Math.min(1, max / Math.max(w, h));
      var c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(w*s));
      c.height = Math.max(1, Math.round(h*s));
      var ctx = c.getContext('2d');
      ctx.drawImage(img, 0, 0, c.width, c.height);
      try { cb(c.toDataURL('image/jpeg', 0.72)); }
      catch(e){ cb(''); }
    };
    img.onerror = function(){ cb(''); };
    img.src = fr.result;
  };
  fr.onerror = function(){ cb(''); };
  fr.readAsDataURL(file);
}

$('picker').addEventListener('change', function(){
  var f = this.files && this.files[0];
  if (!f || pendingPi < 0) return;
  var pi = pendingPi;
  pendingPi = -1;
  shrink(f, function(data){
    if (!data){ alert('这张图读不出来，换一张试试'); return; }
    var p = S.products[pi];
    if (!p) return;
    p.photo = data;
    save();
    render();
    // 加完照片把常用的那台展开
    if (!Object.keys(openIds).length){
      openIds[S.machines[0].id] = true;
      render();
    }
  });
});

/* ---------- 清单文本 ---------- */
function buildText(){
  var lines = ['【补货 ' + cnDate(S.date) + '】'];
  S.machines.forEach(function(m){
    var parts = S.products.filter(function(p){ return num(m.qty[p.id])>0; })
      .map(function(p){ return p.name + ' ' + num(m.qty[p.id]); });
    if (parts.length) lines.push(m.name + '：' + parts.join('，'));
  });
  lines.push('—— 合计 ' + grand() + ' 件');
  return lines.join('\n');
}

function copyText(txt){
  try {
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){ alert('已复制'); },
        function(){ fallbackCopy(txt); });
      return;
    }
  } catch(e){}
  fallbackCopy(txt);
}
function fallbackCopy(txt){
  var ta = document.createElement('textarea');
  ta.value = txt; ta.style.position='fixed'; ta.style.top='-1000px';
  document.body.appendChild(ta); ta.select();
  var ok=false;
  try { ok = document.execCommand('copy'); } catch(e){}
  document.body.removeChild(ta);
  alert(ok ? '已复制' : '复制失败：\n\n'+txt);
}

/* ---------- 事件 ---------- */
$('app').addEventListener('click', function(e){
  var el = e.target.closest('[data-act]');
  if (!el) return;
  var act = el.dataset.act;
  var mi = +el.dataset.mi, pi = +el.dataset.pi;

  if (act === 'toggle'){ var id = S.machines[mi].id; openIds[id] = !openIds[id]; render(); }
  else if (act === 'rename'){ sheetMachine(mi); }
  else if (act === 'inc'){
    var m = S.machines[mi], p = S.products[pi];
    if (!m || !p) return;
    m.qty[p.id] = num(m.qty[p.id]) + 1;
    save(); paintRow(mi, pi);
  }
  else if (act === 'dec'){
    var m2 = S.machines[mi], p2 = S.products[pi];
    if (!m2 || !p2) return;
    m2.qty[p2.id] = Math.max(0, num(m2.qty[p2.id]) - 1);
    save(); paintRow(mi, pi);
  }
  else if (act === 'photo'){ pickPhoto(pi); }
  else if (act === 'editprod'){ sheetProduct(pi); }
  else if (act === 'addprod'){ sheetAddProduct(); }
  else if (act === 'manage'){ sheetManage(); }
  else if (act === 'copy'){ copyText(buildText()); }
});

$('copybtn').addEventListener('click', function(){ copyText(buildText()); });
$('mask').addEventListener('click', closeSheet);

/* ---------- 启动 ---------- */
S = load();
rollover();
save();
if (S.machines[0]) openIds[S.machines[0].id] = true;
render();

setInterval(function(){ if (rollover()) render(); }, 30000);
document.addEventListener('visibilitychange', function(){
  if (!document.hidden){ if (rollover()) render(); else paint(); }
});

if ('serviceWorker' in navigator && location.protocol === 'http:'){
  navigator.serviceWorker.register('./sw.js').catch(function(){});
}
})();
</script>
