<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="刷牙">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0e11">
<title>刷牙洗脸</title>
<style>
:root{
  --bg:#0b0e11; --card:#161b20; --ink:#eef1f4; --sub:#7d868f;
  --line:#232a31; --accent:#5ac8fa; --ok:#4cd964;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);height:100%}
body{
  color:var(--ink);overflow:hidden;
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
  -webkit-text-size-adjust:100%;-webkit-user-select:none;user-select:none;
}
.app{
  height:100dvh;display:flex;flex-direction:column;align-items:center;
  padding:calc(env(safe-area-inset-top) + 22px) 24px calc(env(safe-area-inset-bottom) + 26px);
}

/* 起始 */
.start{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:left;width:100%;max-width:460px}
.eyebrow{font-size:12px;letter-spacing:2.5px;color:var(--sub);margin-bottom:10px}
.start h1{font-size:29px;font-weight:700;letter-spacing:-.6px;margin:0 0 14px}
.start p{font-size:15px;color:var(--sub);line-height:1.85;margin:0 0 8px}
.start .line{font-size:16px;color:var(--ink);line-height:1.8;margin-top:18px}
.start small{display:block;font-size:12.5px;color:#5f6870;margin-top:24px;line-height:1.7}

.begin{
  width:100%;margin-top:34px;padding:22px;border-radius:20px;border:none;
  background:var(--accent);color:#062430;font-size:19px;font-weight:800;letter-spacing:.5px;
  box-shadow:0 10px 30px rgba(90,200,250,.25);
}
.begin:active{transform:scale(.98)}

/* 进行中 */
.run{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%}
.ringbox{position:relative;width:min(64vw,250px)}
.ringbox svg{width:100%;display:block;transform:rotate(-90deg)}
.ringbox .tr{fill:none;stroke:var(--line);stroke-width:8}
.ringbox .pg{fill:none;stroke:var(--accent);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .4s linear}
.ringnum{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringnum b{font-size:52px;font-weight:200;font-variant-numeric:tabular-nums;letter-spacing:-2px}
.ringnum span{font-size:12px;color:var(--sub);letter-spacing:2px;margin-top:6px}
.nowlabel{font-size:23px;font-weight:700;margin-top:30px;letter-spacing:-.3px}
.nowsub{font-size:14px;color:var(--sub);margin-top:10px;height:20px}
.leavebtn{
  position:absolute;top:calc(env(safe-area-inset-top) + 10px);right:18px;
  width:40px;height:40px;border-radius:50%;border:none;
  background:rgba(255,255,255,.07);color:var(--sub);font-size:18px;
}

/* 结束 */
.done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.done .e{font-size:52px;margin-bottom:16px}
.done .q{font-size:25px;font-weight:700;line-height:1.6}
.done .s{font-size:14px;color:var(--sub);margin-top:16px;line-height:1.8;max-width:300px}
.done .b{margin-top:38px;padding:15px 40px;border-radius:15px;border:1px solid var(--line);
  background:transparent;color:var(--ink);font-size:15px;font-weight:700}

.fade{animation:fade .5s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
(function(){
'use strict';

/* 顺序：刷牙 4 段 + 漱口 + 洗脸 3 段 */
var SEGS = [
  { t:'刷牙 · 左上', s:30 },
  { t:'刷牙 · 右上', s:30 },
  { t:'刷牙 · 左下', s:30 },
  { t:'刷牙 · 右下', s:30 },
  { t:'漱口',       s:15 },
  { t:'洗脸 · 额头', s:15 },
  { t:'洗脸 · 两颊', s:15 },
  { t:'洗脸 · 下巴', s:15 }
];

var $ = function(id){ return document.getElementById(id); };
var idx = 0, left = 0, timer = null, ac = null, running = false, paused = false;

function ctx(){
  if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
  if (ac.state === 'suspended') ac.resume();
  return ac;
}
function tone(f, dur, vol, delay){
  try {
    var a = ctx(), t = a.currentTime + (delay||0);
    var o = a.createOscillator(), g = a.createGain();
    o.type = 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol||.07, t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(a.destination);
    o.start(t); o.stop(t+dur+0.03);
  } catch(e){}
}

/* ---------- 起始页 ---------- */
function startView(){
  clearInterval(timer); running = false; paused = false;
  $('app').innerHTML =
    '<div class="start fade">' +
      '<div class="eyebrow">刷牙洗脸</div>' +
      '<h1>现在去刷</h1>' +
      '<p>刚才发生了什么，这里不判断。</p>' +
      '<p>你也不用先想清楚，不用先确认。</p>' +
      '<div class="line">按下面开始，跟着走完就行。</div>' +
      '<button class="begin" id="begin">开始，三分钟</button>' +
      '<small>中途走开也没关系，回来接着走。<br>这一页不问你脏不脏，因为它不负责回答那个。</small>' +
    '</div>';
  $('begin').onclick = begin;
}

/* ---------- 开始 ---------- */
function begin(){
  tone(523,.2,.06); tone(659,.2,.05,'sine',.1);
  idx = 0; paused = false; running = true;
  runView();
  tick();
  timer = setInterval(tick, 1000);
}

function totalLeft(){
  var s = 0;
  for (var i=idx;i<SEGS.length;i++) s += SEGS[i].s;
  return s;
}

function totalAll(){
  var s = 0;
  for (var i=0;i<SEGS.length;i++) s += SEGS[i].s;
  return s;
}

/* ---------- 进行中 ---------- */
function runView(){
  var seg = SEGS[idx];
  left = seg.s;
  var total = totalAll();
  $('app').innerHTML =
    '<button class="leavebtn" id="quit">✕</button>' +
    '<div class="run fade">' +
      '<div class="ringbox">' +
        '<svg viewBox="0 0 120 120">' +
          '<circle class="tr" cx="60" cy="60" r="52"></circle>' +
          '<circle class="pg" id="pg" cx="60" cy="60" r="52"></circle>' +
        '</svg>' +
        '<div class="ringnum"><b id="sec">' + seg.s + '</b><span>秒</span></div>' +
      '</div>' +
      '<div class="nowlabel" id="lbl">' + seg.t + '</div>' +
      '<div class="nowsub" id="sub"></div>' +
    '</div>';
  $('quit').onclick = quit;
  paint();
}

function paint(){
  var seg = SEGS[idx];
  if (!seg) return;
  var C = 2 * Math.PI * 52;
  var pg = $('pg');
  if (pg){
    pg.style.strokeDasharray = C;
    var p = 1 - (left / seg.s);
    pg.style.strokeDashoffset = C * (1 - Math.max(0, Math.min(1, p)));
  }
  var s = $('sec'); if (s) s.textContent = left;
  var l = $('lbl'); if (l) l.textContent = SEGS[idx] ? SEGS[idx].t : '';
}

function tick(){
  if (left <= 0){
    idx++;
    if (idx >= SEGS.length){ finish(); return; }
    tone(880,.12,.06);
    left = SEGS[idx].s;
    var l = $('lbl'); if (l) l.textContent = SEGS[idx].t;
    var s = $('sec'); if (s) s.textContent = left;
    paint();
    return;
  }
  left--;
  paint();
  if (left === 15 || left === 5){ tone(660,.08,.035); }
}

/* ---------- 结束 ---------- */
function finish(){
  clearInterval(timer); timer = null; running = false;
  $('app').innerHTML =
    '<div class="done fade">' +
      '<div class="e">🫧</div>' +
      '<div class="q">刷完了</div>' +
      '<div class="s">刚才那趟厕所，没有改变任何事。<br>你也没有先确认什么，就做完了。</div>' +
      '<button class="b" id="again">好</button>' +
    '</div>';
  tone(523,.35,.06); tone(659,.35,.05,'sine',.12); tone(784,.5,.05,'sine',.26);
  $('again').onclick = startView;
}

function quit(){
  clearInterval(timer); timer = null; running = false;
  startView();
}

/* ---------- 离开自动暂停 ---------- */
document.addEventListener('visibilitychange', function(){
  if (!timer) return;
  if (document.hidden){
    clearInterval(timer); timer = null; paused = true;
  } else if (paused){
    paused = false;
    timer = setInterval(tick, 1000);
  }
});

startView();

if ('serviceWorker' in navigator && location.protocol === 'http:'){
  navigator.serviceWorker.register('./sw.js').catch(function(){});
}
})();
</script>
</body>
</html>
