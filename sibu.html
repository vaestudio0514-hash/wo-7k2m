<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="四步">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0e11">
<title>四步</title>
<style>
:root{
  --bg:#0b0e11; --card:#161b20; --ink:#eef1f4; --sub:#7d868f;
  --line:#232a31; --accent:#5ac8fa; --ok:#4cd964; --warm:#ffb86b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);height:100%}
body{
  color:var(--ink);overflow:hidden;
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
  -webkit-text-size-adjust:100%;-webkit-user-select:none;user-select:none;
}
.app{
  height:100dvh;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 18px) 22px calc(env(safe-area-inset-bottom) + 22px);
}

/* 选档 */
.pickwrap{flex:1;display:flex;flex-direction:column;justify-content:center}
.pickwrap .eyebrow{font-size:12px;letter-spacing:2.5px;color:var(--sub);margin-bottom:8px}
.pickwrap h1{font-size:27px;font-weight:700;letter-spacing:-.5px;margin:0 0 8px}
.pickwrap p{font-size:14px;color:var(--sub);margin:0 0 26px;line-height:1.6}
.mode{
  width:100%;padding:22px 20px;border-radius:18px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);margin-bottom:10px;
  display:flex;align-items:center;gap:14px;text-align:left;
  transition:transform .12s,background .2s;
}
.mode:active{transform:scale(.985);background:#1b2127}
.mode .me{font-size:30px}
.mode .mt{flex:1;font-size:18px;font-weight:700}
.mode .ms{font-size:12px;color:var(--sub);margin-top:3px;font-weight:400}
.mode .arrow{color:var(--sub);font-size:16px}

/* 步骤 */
.dots{display:flex;gap:9px;justify-content:center;margin-top:6px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line);transition:.35s}
.dots i.on{background:var(--accent);transform:scale(1.25)}
.dots i.gone{background:transparent;border:1px solid #2c343c;transform:scale(.6);opacity:.5}

.body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative}
.emo{font-size:84px;line-height:1;margin-bottom:22px;animation:pop .45s cubic-bezier(.2,1.3,.4,1) both}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
.step-name{font-size:31px;font-weight:700;letter-spacing:-.5px}
.step-sub{font-size:14px;color:var(--sub);margin-top:12px;line-height:1.7}
.count{font-size:13px;color:var(--sub);margin-top:26px;letter-spacing:2px}

.leave{animation:leave .42s cubic-bezier(.5,0,.8,0) forwards}
@keyframes leave{to{opacity:0;transform:translateY(-40px) scale(.78)}}

/* 捞起来专用：往上弹一下 */
.rise{animation:rise .55s cubic-bezier(.2,1.4,.4,1) both !important}
@keyframes rise{0%{transform:scale(.8) translateY(10px)}60%{transform:scale(1.15) translateY(-14px)}100%{transform:scale(1) translateY(0)}}

.gobtn{
  width:100%;padding:22px;border-radius:20px;border:none;
  background:var(--accent);color:#062430;
  font-size:19px;font-weight:800;letter-spacing:.5px;
  box-shadow:0 10px 30px rgba(90,200,250,.25);
  transition:transform .1s;
}
.gobtn:active{transform:scale(.975);box-shadow:0 4px 14px rgba(90,200,250,.18)}
.gobtn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none;font-weight:600}
.gobtn{position:relative;overflow:hidden;isolation:isolate}
.gobtn .fill{
  position:absolute;left:0;top:0;bottom:0;width:0;z-index:0;
  background:rgba(0,0,0,.22);
}
.gobtn.holding .fill{width:100%;transition:width 1.1s linear}
.gobtn.holding{transform:scale(.99)}
.gobtn .lbl{position:relative;z-index:1}

@keyframes whiteflash{0%{opacity:.85}100%{opacity:0}}
.flashw{position:fixed;inset:0;z-index:99;background:#fff;pointer-events:none;animation:whiteflash .32s ease-out forwards}

@keyframes shakek{0%,100%{transform:translate(0,0)}20%{transform:translate(-3px,2px)}40%{transform:translate(3px,-2px)}60%{transform:translate(-2px,-1px)}80%{transform:translate(2px,1px)}}
.shake{animation:shakek .32s ease}


.row2{display:flex;gap:10px}
.row2>button{flex:1}

/* 冲刷提示 */
.flash{
  position:fixed;inset:0;z-index:60;background:#0a1014;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  animation:fadeIn .25s ease both;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.flash.out{opacity:0;transition:opacity .45s}
.flash .ft{font-size:21px;font-weight:700;line-height:1.6}
.flash .fs{font-size:14px;color:var(--sub);margin-top:14px}
.flash .wave{display:flex;gap:5px;align-items:flex-end;height:44px;margin-top:26px}
.flash .wave i{width:4px;border-radius:2px;background:var(--accent);opacity:.7;animation:wv .9s ease-in-out infinite}
.flash .wave i:nth-child(2){animation-delay:.15s}
.flash .wave i:nth-child(3){animation-delay:.3s}
.flash .wave i:nth-child(4){animation-delay:.45s}
.flash .wave i:nth-child(5){animation-delay:.6s}
@keyframes wv{0%,100%{height:8px}50%{height:38px}}

/* 完成页 */
.finish{
  position:fixed;inset:0;z-index:55;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:30px;animation:fadeIn .5s ease both;
}
.finish .fe{font-size:56px;margin-bottom:18px}
.finish .fq{font-size:24px;font-weight:700;line-height:1.6}
.finish .fs2{font-size:14px;color:var(--sub);margin-top:16px;line-height:1.8}
.finish .rainline{display:flex;gap:6px;align-items:flex-end;height:34px;margin-top:24px;opacity:.7}
.finish .rainline i{width:3px;border-radius:2px;background:var(--sub);animation:wv 1.1s ease-in-out infinite}
.finish .rainline i:nth-child(2){animation-delay:.2s}
.finish .rainline i:nth-child(3){animation-delay:.4s}
.finish .rainline i:nth-child(4){animation-delay:.6s}
.finish .btns{display:flex;gap:10px;margin-top:34px}
.finish .btns button{
  padding:15px 30px;border-radius:15px;border:1px solid var(--line);
  background:transparent;color:var(--ink);font-size:15px;font-weight:700;
}
.finish .btns button.pri{background:var(--accent);color:#062430;border-color:var(--accent)}
</style>
</head>
<body>
<div class="app">
  <div class="dots" id="dots"></div>
  <div class="body" id="body"></div>
  <div id="foot"></div>
</div>

<script>
(function(){
'use strict';

var MODES = [
  { id:'big',   e:'🚽', name:'大号',  steps:[
      { e:'🧻', t:'擦屁股', s:'paper' },
      { e:'👖', t:'捞起来', s:'up' },
      { e:'🚽', t:'冲厕所', s:'flush', sub:'按完就走，别听回放' },
      { e:'🧼', t:'洗手',   s:'wash' }
  ]},
  { id:'small', e:'💧', name:'小号',  steps:[
      { e:'👖', t:'捞起来', s:'up' },
      { e:'🚽', t:'冲厕所', s:'flush', sub:'按完就走，别听回放' },
      { e:'🧼', t:'洗手',   s:'wash' }
  ]},
  { id:'wash',  e:'🧼', name:'只洗手', steps:[
      { e:'🧼', t:'洗手',   s:'wash' }
  ]}
];

var mode = null, i = 0, ac = null, busy = false;

function $(id){ return document.getElementById(id); }

/* ---------- 声音 ---------- */
function ctx(){
  if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
  if (ac.state === 'suspended') ac.resume();
  return ac;
}
function tone(f, dur, vol, delay){
  try {
    var a = ctx(), t = a.currentTime + (delay||0);
    var o = a.createOscillator(), g = a.createGain();
    o.type = 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol||.08, t+0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(a.destination);
    o.start(t); o.stop(t+dur+0.03);
  } catch(e){}
}
function noiseBuf(a, sec){
  var len = Math.floor(a.sampleRate * sec), buf = a.createBuffer(1, len, a.sampleRate);
  var d = buf.getChannelData(0);
  for (var i=0;i<len;i++) d[i] = (Math.random()*2-1);
  return buf;
}

/* 擦屁股：干、短、纸的质感 */
function sPaper(){
  try {
    var a = ctx(), t = a.currentTime;
    var s = a.createBufferSource(); s.buffer = noiseBuf(a, .18);
    var f = a.createBiquadFilter(); f.type='highpass'; f.frequency.value = 2200;
    var g = a.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(.07, t+.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t+.16);
    s.connect(f); f.connect(g); g.connect(a.destination); s.start();
  } catch(e){}
}

/* 捞起来：整个人往上提——滑上去的音，最后叮一下 */
function sUp(){
  try {
    var a = ctx(), t = a.currentTime;
    var o = a.createOscillator(), g = a.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(300, t);
    o.frequency.exponentialRampToValueAtTime(820, t+.26);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(.09, t+.04);
    g.gain.exponentialRampToValueAtTime(0.0001, t+.3);
    o.connect(g); g.connect(a.destination);
    o.start(t); o.stop(t+.33);
    tone(1046, .18, .05, .22);
    tone(1318, .26, .04, .30);
    // 落地：往上提完之后，沉一下，别让耳朵悬着
    var o2 = a.createOscillator(), g2 = a.createGain();
    o2.type = 'sine';
    o2.frequency.setValueAtTime(160, t+.34);
    o2.frequency.exponentialRampToValueAtTime(72, t+.62);
    g2.gain.setValueAtTime(0.0001, t+.34);
    g2.gain.exponentialRampToValueAtTime(.11, t+.37);
    g2.gain.exponentialRampToValueAtTime(0.0001, t+.72);
    o2.connect(g2); g2.connect(a.destination);
    o2.start(t+.34); o2.stop(t+.75);
  } catch(e){}
}

/* 洗手：水声 + 亮一点的和音 */
function sWash(){
  try {
    var a = ctx(), t = a.currentTime;
    var s = a.createBufferSource(); s.buffer = noiseBuf(a, .7);
    var f = a.createBiquadFilter(); f.type='bandpass'; f.Q.value = .8;
    f.frequency.setValueAtTime(1600, t);
    f.frequency.exponentialRampToValueAtTime(900, t+.55);
    var g = a.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(.09, t+.05);
    g.gain.exponentialRampToValueAtTime(0.0001, t+.65);
    s.connect(f); f.connect(g); g.connect(a.destination); s.start();
    tone(784, .2, .04, .1);
    tone(1046, .28, .035, .2);
  } catch(e){}
}

/* 冲厕所：雨声盖住回放 */
function rainFor(sec){
  try {
    var a = ctx();
    var s = a.createBufferSource(); s.buffer = noiseBuf(a, 2); s.loop = true;
    var hp = a.createBiquadFilter(); hp.type='highpass'; hp.frequency.value = 200;
    var lp = a.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value = 1500;
    var g = a.createGain(); g.gain.value = .0001;
    g.gain.linearRampToValueAtTime(.15, a.currentTime + .25);
    g.gain.setValueAtTime(.15, a.currentTime + sec - .4);
    g.gain.linearRampToValueAtTime(.0001, a.currentTime + sec);
    s.connect(hp); hp.connect(lp); lp.connect(g); g.connect(a.destination);
    s.start();
    setTimeout(function(){ try{ s.stop(); }catch(e){} }, (sec+.2)*1000);
  } catch(e){}
}

function playSound(kind){
  if (kind === 'paper') sPaper();
  else if (kind === 'up') sUp();
  else if (kind === 'wash') sWash();
  else if (kind === 'flush') { rainFor(6); }
}

/* ---------- 选档 ---------- */
function pick(){
  mode = null; i = 0;
  $('dots').innerHTML = '';
  var o = '<div class="pickwrap">';
  o += '<div class="eyebrow">四步</div>';
  o += '<h1>这次是哪一档</h1>';
  o += '<p>选一个，直接开始。不用记，按完就走。</p>';
  MODES.forEach(function(m){
    o += '<button class="mode" data-mode="'+m.id+'">' +
         '<span class="me">'+m.e+'</span>' +
         '<span class="mt">'+m.name+'<span class="ms">'+m.steps.length+' 步</span></span>' +
         '<span class="arrow">›</span></button>';
  });
  o += '</div>';
  $('body').innerHTML = o;
  $('foot').innerHTML = '';
  $('body').querySelectorAll('.mode').forEach(function(b){
    b.onclick = function(){ start(b.dataset.mode); };
  });
}

function start(id){
  mode = MODES.filter(function(m){ return m.id === id; })[0];
  if (!mode) return;
  i = 0;
  run();
}

/* ---------- 步骤 ---------- */
function dotsHtml(){
  var o = '';
  for (var k=0;k<mode.steps.length;k++){
    o += '<i class="' + (k < i ? 'gone' : (k === i ? 'on' : '')) + '"></i>';
  }
  return o;
}

function run(){
  $('dots').innerHTML = dotsHtml();
  var s = mode.steps[i];
  var isLast = (i === mode.steps.length - 1);
  var sub = s.sub || (s.s === 'up' ? '提好，往上走' : '做完就按下面');

  $('body').innerHTML =
    '<div class="emo'+'">' + s.e + '</div>' +
    '<div class="step-name">' + s.t + '</div>' +
    '<div class="step-sub">' + sub + '</div>' +
    '<div class="count">第 ' + (i+1) + ' / ' + mode.steps.length + ' 步</div>';

  $('foot').innerHTML = '<button class="gobtn" id="go">' +
    '<span class="fill"></span>' +
    '<span class="lbl">' + (isLast ? '按住，结束' : '按住，做完了') + '</span>' +
    '</button>';
  bindHold($('go'));
}

var HOLD = 1100;

function bindHold(btn){
  var timer = null, osc = null, gain = null, holding = false;

  function start(e){
    if (busy || holding) return;
    e.preventDefault();
    holding = true;
    try { btn.setPointerCapture(e.pointerId); } catch(err){}
    btn.classList.add('holding');
    var lbl = btn.querySelector('.lbl');
    if (lbl) lbl.textContent = '别松手…';

    try {
      var a = ctx();
      osc = a.createOscillator(); gain = a.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(280, a.currentTime);
      osc.frequency.linearRampToValueAtTime(920, a.currentTime + HOLD/1000);
      gain.gain.setValueAtTime(0.0001, a.currentTime);
      gain.gain.linearRampToValueAtTime(.055, a.currentTime + .12);
      osc.connect(gain); gain.connect(a.destination);
      osc.start();
    } catch(err){}

    timer = setTimeout(function(){
      holding = false;
      stopTone();
      btn.classList.remove('holding');
      confirmHit();
    }, HOLD);
  }

  function cancel(){
    if (!holding) return;
    holding = false;
    clearTimeout(timer);
    timer = null;
    stopTone();
    btn.classList.remove('holding');
    var lbl = btn.querySelector('.lbl');
    if (lbl) lbl.textContent = '按住不放，等它走满';
    setTimeout(function(){
      var l2 = btn.querySelector('.lbl');
      if (l2 && !holding) l2.textContent = (i === mode.steps.length-1) ? '按住，结束' : '按住，做完了';
    }, 1200);
  }

  function stopTone(){
    try { if (osc) { osc.stop(); osc.disconnect(); } } catch(err){}
    try { if (gain) gain.disconnect(); } catch(err){}
    osc = null; gain = null;
  }

  btn.addEventListener('pointerdown', start);
  btn.addEventListener('pointerup', cancel);
  btn.addEventListener('pointercancel', cancel);
  btn.addEventListener('pointerleave', cancel);
}

function confirmHit(){
  // 一下硬响：确认这件事真的发生了
  try {
    var a = ctx(), t = a.currentTime;
    var s2 = a.createBufferSource(); s2.buffer = noiseBuf(a, .08);
    var f2 = a.createBiquadFilter(); f2.type = 'bandpass'; f2.frequency.value = 1800; f2.Q.value = 2;
    var g2 = a.createGain();
    g2.gain.setValueAtTime(.16, t);
    g2.gain.exponentialRampToValueAtTime(0.0001, t+.09);
    s2.connect(f2); f2.connect(g2); g2.connect(a.destination); s2.start();
    tone(92, .22, .12, .01);
  } catch(e){}

  var fl = document.createElement('div');
  fl.className = 'flashw';
  document.body.appendChild(fl);
  setTimeout(function(){ fl.remove(); }, 340);

  document.body.classList.add('shake');
  setTimeout(function(){ document.body.classList.remove('shake'); }, 340);

  advance();
}

function advance(){
  if (busy || !mode) return;
  busy = true;

  var s = mode.steps[i];
  var emo = $('body').querySelector('.emo');
  playSound(s.s);

  if (emo){
    if (s.s === 'up'){
      emo.classList.remove('leave');
      emo.classList.add('rise');
    } else {
      emo.classList.add('leave');
    }
  }

  if (s.s === 'flush') flushMask();

  setTimeout(function(){
    i++;
    busy = false;
    if (i >= mode.steps.length) finish();
    else run();
  }, 400);
}

function flushMask(){
  var d = document.createElement('div');
  d.className = 'flash';
  d.innerHTML =
    '<div class="ft">冲完了</div>' +
    '<div class="fs">听这个，别听回放</div>' +
    '<div class="wave"><i></i><i></i><i></i><i></i><i></i></div>';
  document.body.appendChild(d);
  setTimeout(function(){
    d.classList.add('out');
    setTimeout(function(){ d.remove(); }, 500);
  }, 4200);
}

function finish(){
  $('dots').innerHTML = '';
  $('foot').innerHTML = '';
  var d = document.createElement('div');
  d.className = 'finish';
  d.innerHTML =
    '<div class="fe">🌿</div>' +
    '<div class="fq">' + mode.name + '，做完了</div>' +
    '<div class="fs2">那个冲水声已经过去了。<br>不用回去想它，也不用再听一遍。<br><br>现在出去，做下一件事。</div>' +
    '<div class="rainline"><i></i><i></i><i></i><i></i></div>' +
    '<div class="btns"><button id="again">再来一次</button>' +
    '<button class="pri" id="other">换一档</button></div>';
  document.body.appendChild(d);
  rainFor(12);
  tone(523,.4,.05); tone(659,.4,.045,'sine',.12); tone(784,.6,.045,'sine',.26);

  document.getElementById('again').onclick = function(){ d.remove(); i = 0; run(); };
  document.getElementById('other').onclick = function(){ d.remove(); pick(); };
}

// 支持直接进某一档：?m=big / ?m=small / ?m=wash
var q = (location.search || '').match(/[?&]m=(big|small|wash)/);
if (q) start(q[1]);
else pick();
})();
</script>
</body>
</html>
