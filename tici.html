<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>提示词</title>
<style>
  :root{--bg:#0a0c10;--card:#12161c;--line:#242a33;--txt:#e8ecf3;--dim:#8b95a5;--acc:#4f8cff;--soft:rgba(79,140,255,.16)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--txt)}
  body{font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;padding-bottom:130px}
  header{position:sticky;top:0;z-index:20;background:var(--bg);padding:12px 16px 9px;border-bottom:1px solid var(--line)}
  h1{margin:0 0 9px;font-size:17px;font-weight:650;letter-spacing:.5px;display:flex;justify-content:space-between;align-items:baseline}
  h1 em{font-style:normal;font-size:11px;color:var(--dim);font-weight:400}
  #q{width:100%;background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:11px;padding:10px 12px;font:15px inherit;outline:none}
  #q:focus{border-color:var(--acc)}
  .seg{display:flex;gap:6px;margin-top:9px}
  .seg button{flex:1;background:var(--card);border:1px solid var(--line);color:var(--dim);border-radius:9px;padding:7px;font:13px inherit}
  .seg button.on{background:var(--soft);border-color:var(--acc);color:#b9d0ff}
  nav{display:flex;gap:7px;overflow-x:auto;padding:9px 16px;background:var(--bg);border-bottom:1px solid var(--line);-webkit-overflow-scrolling:touch}
  nav::-webkit-scrollbar{display:none}
  .cat{flex:0 0 auto;background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:999px;padding:6px 12px;font:13px inherit}
  .cat.on{background:var(--soft);border-color:var(--acc);color:#b9d0ff}
  #grid{padding:12px 16px;display:flex;flex-wrap:wrap;gap:7px}
  .chip{background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:999px;padding:7px 12px;font:14px inherit;text-align:left}
  .chip.on{background:var(--soft);border-color:var(--acc);color:#b9d0ff}
  .chip small{opacity:.55;font-size:11px;margin-left:5px}
  .hint{padding:0 16px 6px;color:var(--dim);font-size:12px}
  .bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(10,12,16,.97);border-top:1px solid var(--line);padding:9px 16px calc(9px + env(safe-area-inset-bottom));backdrop-filter:blur(8px)}
  .selrow{display:flex;gap:7px;overflow-x:auto;min-height:28px;align-items:center;margin-bottom:8px}
  .selrow::-webkit-scrollbar{display:none}
  .sel{flex:0 0 auto;background:var(--soft);border:1px solid var(--acc);color:#cfe0ff;border-radius:999px;padding:4px 9px;font:12px inherit}
  .muted{color:var(--dim);font-size:12px}
  .actions{display:flex;gap:9px}
  .actions button{flex:1;background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:11px;padding:11px;font:14px inherit}
  #copy{background:var(--acc);border:0;color:#fff;font-weight:600}
  .out{padding:0 16px 14px}
  .outcard{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:11px;margin-bottom:11px}
  .outhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .outhead span{font-size:12px;color:var(--dim)}
  .outhead button{background:#0c0f14;border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:5px 11px;font:12px inherit}
  pre{margin:0;white-space:pre-wrap;word-break:break-word;font:13px/1.6 -apple-system,"PingFang SC",monospace;color:#d7e0ee;min-height:36px}
  .toast{position:fixed;left:50%;bottom:140px;transform:translateX(-50%) translateY(10px);background:#e8ecf3;color:#0a0c10;padding:9px 16px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:40}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<header>
  <h1>提示词 <em id="count"></em></h1>
  <input id="q" placeholder="搜索：中文 / English" autocomplete="off">
  <div class="seg" id="mode">
    <button data-m="tag" class="on">标签</button>
    <button data-m="char">角色</button>
    <button data-m="preset">预设</button>
  </div>
</header>
<nav id="cats"></nav>
<div class="hint" id="hint"></div>
<div id="grid"></div>

<div class="out">
  <div class="outcard">
    <div class="outhead"><span>标签串（逗号）</span><button data-copy="tags">复制</button></div>
    <pre id="tags"></pre>
  </div>
  <div class="outcard">
    <div class="outhead"><span>中文句子（MOSS 用）</span><button data-copy="zh">复制</button></div>
    <pre id="zh"></pre>
  </div>
</div>

<div class="bar">
  <div class="selrow" id="selrow"><span class="muted">还没选词</span></div>
  <div class="actions">
    <button id="clear">清空</button>
    <button id="copy">复制标签串</button>
  </div>
</div>

<div class="toast" id="toast">已复制</div>

</script>
<script>
(function(){
  var D = window.PF;
  var ORDER = ['style','moss','base','hair','face','expression','pose','clothing','environment','lighting','camera','composition','weather','accessory','props','body','artist','supplement','negative'];
  var byId = {};
  D.tags.forEach(function(c){ byId[c.id] = c; });
  ORDER.forEach(function(id){ if(byId[id]) byId[id]._o = ORDER.indexOf(id); });

  var sel = {};
  var mode = 'tag';
  var cat = 'all';
  var q = '';

  var catsEl = document.getElementById('cats');
  var gridEl = document.getElementById('grid');
  var qEl = document.getElementById('q');
  var tagsEl = document.getElementById('tags');
  var zhEl = document.getElementById('zh');
  var selrow = document.getElementById('selrow');
  var toastEl = document.getElementById('toast');
  var hintEl = document.getElementById('hint');
  var countEl = document.getElementById('count');

  try{ var s = JSON.parse(localStorage.getItem('pf_sel2')||'{}'); if(s&&typeof s==='object') sel = s; }catch(e){}

  countEl.textContent = D.tags.reduce(function(a,c){return a+c.tags.length},0) + ' 标签 · ' + D.chars.length + ' 角色 · ' + D.presets.length + ' 预设';

  function tagCats(){
    var list = D.tags.slice().sort(function(a,b){ return (a._o==null?99:a._o) - (b._o==null?99:b._o); });
    var all = {id:'all', name:'全部', n: D.tags.reduce(function(a,c){return a+c.tags.length},0)};
    return [all].concat(list);
  }

  function renderCats(){
    catsEl.innerHTML = '';
    catsEl.style.display = (mode==='tag') ? 'flex' : 'none';
    if(mode!=='tag') return;
    tagCats().forEach(function(c){
      var b = document.createElement('button');
      b.className = 'cat' + (cat===c.id?' on':'');
      b.textContent = c.name + (c.n?(' '+c.n):'');
      b.onclick = function(){ cat=c.id; q=''; qEl.value=''; renderCats(); renderGrid(); };
      catsEl.appendChild(b);
    });
  }

  function matches(en,zh,kw){
    if(!kw) return true;
    kw = kw.toLowerCase();
    return en.toLowerCase().indexOf(kw)>=0 || zh.indexOf(kw)>=0;
  }

  function chip(label, sub, on, fn){
    var b = document.createElement('button');
    b.className = 'chip' + (on?' on':'');
    b.textContent = label;
    if(sub){ var s=document.createElement('small'); s.textContent=sub; b.appendChild(s); }
    b.onclick = fn;
    return b;
  }

  function renderGrid(){
    gridEl.innerHTML = '';
    var kw = q.trim();
    var frag = document.createDocumentFragment();
    var shown = 0, total = 0;

    if(mode==='tag'){
      var list = [];
      if(kw){
        D.tags.forEach(function(c){ c.tags.forEach(function(t){ if(matches(t[0],t[1],kw)) list.push({t:t,cat:c.id}); }); });
      } else if(cat==='all'){
        D.tags.forEach(function(c){ c.tags.forEach(function(t){ list.push({t:t,cat:c.id}); }); });
      } else {
        (byId[cat]||{tags:[]}).tags.forEach(function(t){ list.push({t:t,cat:cat}); });
      }
      total = list.length;
      list.slice(0,500).forEach(function(it){
        var en=it.t[0], zh=it.t[1];
        frag.appendChild(chip(zh||en, kw&&cat==='all'?(byId[it.cat]||{}).name:'', !!sel[en], function(){
          if(sel[en]) delete sel[en]; else sel[en]={en:en,zh:zh,cat:it.cat};
          renderGrid(); update();
        }));
      });
      shown = Math.min(total,500);
    }

    if(mode==='char'){
      var cs = D.chars;
      if(kw) cs = cs.filter(function(c){ return matches(c.tag, c.zh, kw) || (c.g||'').indexOf(kw)>=0; });
      total = cs.length;
      cs.slice(0,400).forEach(function(c){
        frag.appendChild(chip(c.zh, c.g, false, function(){
          addTags(c.t, 'char');
          toast('已加入 ' + c.zh);
        }));
      });
      shown = Math.min(total,400);
    }

    if(mode==='preset'){
      var ps = D.presets;
      if(kw) ps = ps.filter(function(p){ return matches(p.n, p.n, kw) || (p.c||'').indexOf(kw)>=0 || (p.d||'').indexOf(kw)>=0; });
      total = ps.length;
      ps.slice(0,400).forEach(function(p){
        frag.appendChild(chip(p.n, p.c, false, function(){
          addTags(p.t, 'preset');
          toast('已加入预设 ' + p.n);
        }));
      });
      shown = Math.min(total,400);
    }

    gridEl.appendChild(frag);
    hintEl.textContent = (total>shown) ? ('共 ' + total + ' 项，显示前 ' + shown + '，输入关键词缩小范围') : ('共 ' + total + ' 项');
  }

  function addTags(list, from){
    list.forEach(function(t){
      var en = t[0], zh = t[1];
      if(!sel[en]) sel[en] = {en:en, zh:zh, cat: from==='char' ? 'base' : (from==='preset' ? 'style' : 'supplement')};
    });
    update();
  }

  function zhJoin(a){ return a.map(function(x){return x.zh}).join('、'); }
  function enJoin(a){ return a.map(function(x){return x.en}).join(', '); }
  function pick(pos, ids){ return pos.filter(function(x){ return ids.indexOf(x.cat)>=0; }); }

  function sentence(pos){
    if(!pos.length) return '';
    var base=pick(pos,['base']), app=pick(pos,['hair','face','body','clothing','accessory']),
        act=pick(pos,['pose','expression']), env=pick(pos,['environment']), wx=pick(pos,['weather']),
        li=pick(pos,['lighting']), cam=pick(pos,['camera','composition']),
        sty=pick(pos,['style','moss','artist','supplement']), pr=pick(pos,['props']);
    var parts=[];
    var line = base.length ? zhJoin(base) : '画面';
    if(app.length) line += '，' + zhJoin(app);
    if(act.length) line += '，' + zhJoin(act);
    parts.push(line + '。');
    if(env.length) parts.push('场景在' + zhJoin(env) + '。');
    if(wx.length) parts.push(zhJoin(wx) + '。');
    if(pr.length) parts.push('画面里有' + zhJoin(pr) + '。');
    if(li.length) parts.push('光线：' + zhJoin(li) + '。');
    if(cam.length) parts.push('镜头：' + zhJoin(cam) + '。');
    if(sty.length) parts.push('风格：' + zhJoin(sty) + '。');
    return parts.join('');
  }

  function update(){
    var all = Object.keys(sel).map(function(k){return sel[k]});
    var neg = all.filter(function(x){return x.cat==='negative'});
    var pos = all.filter(function(x){return x.cat!=='negative'});
    tagsEl.textContent = enJoin(pos) + (neg.length ? '\n负向：' + enJoin(neg) : '');
    zhEl.textContent = sentence(pos);
    renderSel(all);
    try{ localStorage.setItem('pf_sel2', JSON.stringify(sel)); }catch(e){}
  }

  function renderSel(all){
    selrow.innerHTML = '';
    if(!all.length){ selrow.innerHTML='<span class="muted">还没选词</span>'; return; }
    var head=document.createElement('span'); head.className='muted'; head.textContent=all.length+' 个';
    selrow.appendChild(head);
    all.forEach(function(x){
      var c=document.createElement('button'); c.className='sel'; c.textContent=x.zh+' ×';
      c.onclick=function(){ delete sel[x.en]; renderGrid(); update(); };
      selrow.appendChild(c);
    });
  }

  qEl.addEventListener('input', function(){ q=qEl.value; renderGrid(); });

  document.getElementById('mode').addEventListener('click', function(e){
    var b=e.target.closest('button'); if(!b) return;
    mode=b.dataset.m;
    document.querySelectorAll('#mode button').forEach(function(x){ x.classList.toggle('on', x.dataset.m===mode); });
    cat='all'; renderCats(); renderGrid();
    window.scrollTo({top:0});
  });

  document.getElementById('clear').onclick=function(){ sel={}; renderGrid(); update(); };

  function toast(m){
    toastEl.textContent=m; toastEl.classList.add('show');
    clearTimeout(toast._t); toast._t=setTimeout(function(){toastEl.classList.remove('show')},1500);
  }

  function copyText(text){
    if(!text){toast('还没有内容');return;}
    function done(){toast('已复制')}
    function fb(){var ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done()}catch(e){toast('复制失败')}document.body.removeChild(ta)}
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done,fb); else fb();
  }

  document.getElementById('copy').onclick=function(){ copyText(tagsEl.textContent.trim()) };
  document.querySelectorAll('[data-copy]').forEach(function(b){
    b.onclick=function(){ copyText((b.dataset.copy==='tags'?tagsEl:zhEl).textContent.trim()) };
  });

  renderCats(); renderGrid(); update();
})();
</script>
